name: Build AgentStudio.exe

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6 requests pywinauto Pillow
    
    - name: Check VC++ Redistributable
      run: |
        # Check if VC++ 2015-2022 Redistributable is installed
        $vcRedist = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64' -ErrorAction SilentlyContinue
        if (-not $vcRedist) {
          Write-Host "VC++ Redistributable not found. Downloading..."
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile 'vc_redist.x64.exe'
          Start-Process -FilePath 'vc_redist.x64.exe' -Args '/quiet /norestart' -Wait
        } else {
          Write-Host "VC++ Redistributable already installed"
        }
    
    - name: Build with PyInstaller (directory mode)
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      run: |
        cd desktop_app
        # Find PyQt6 Qt6 plugins directory
        python -c "import PyQt6, os; print(os.path.join(os.path.dirname(PyQt6.__file__), 'Qt6'))" > qt6_path.txt
        $qt6Path = Get-Content qt6_path.txt -First 1
        Write-Host "Qt6 path: $qt6Path"
        
        # Build with PyInstaller
        pyinstaller --onedir --windowed --name AgentStudio `
          --hidden-import PyQt6.QtCore `
          --hidden-import PyQt6.QtGui `
          --hidden-import PyQt6.QtWidgets `
          --hidden-import PyQt6.QtSvg `
          --collect-all PyQt6 `
          main.py
        
        # Manually copy Qt6 plugins
        if (Test-Path $qt6Path) {
          Write-Host "Copying Qt6 plugins..."
          $destDir = 'dist/AgentStudio/PyQt6/Qt6'
          if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force }
          Copy-Item -Path "$qt6Path/*" -Destination $destDir -Recurse -Force
          Write-Host "Qt6 plugins copied"
        } else {
          Write-Host "WARNING: Qt6 path not found"
        }
    
    - name: Verify Qt6 plugins
      run: |
        Get-ChildItem desktop_app/dist/AgentStudio/PyQt6/Qt6/plugins/platforms -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*.dll' } | Select-Object Name, Length
    
    - name: Check build output
      run: |
        Get-ChildItem desktop_app/dist/AgentStudio -Recurse | Where-Object { $_.Name -like "*.exe" -or $_.Name -like "*.dll" } | Select-Object Name, Length | Sort-Object Length -Descending | Select-Object -First 20
    
    - name: Upload artifact (folder)
      uses: actions/upload-artifact@v4
      with:
        name: AgentStudio-V5
        path: desktop_app/dist/AgentStudio
        retention-days: 30
