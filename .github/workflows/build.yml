name: Build AgentStudio.exe

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6 requests pywinauto Pillow
    
    - name: Build with PyInstaller
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      run: |
        cd desktop_app
        pyinstaller --onefile --windowed --name AgentStudio main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AgentStudio-V5
        path: desktop_app/dist/AgentStudio.exe
        retention-days: 7
    
    - name: Show output size
      run: |
        ls -lh desktop_app/dist/AgentStudio.exe
        
    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: AgentStudio V5 Build ${{ github.run_number }}
        files: desktop_app/dist/AgentStudio.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}