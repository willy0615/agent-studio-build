name: Build AgentStudio.exe

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6 requests pywinauto Pillow
    
    - name: Build with PyInstaller
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      run: |
        cd desktop_app
        pyinstaller --onefile --console --name AgentStudio_debug `
          --hidden-import PyQt6.QtCore `
          --hidden-import PyQt6.QtGui `
          --hidden-import PyQt6.QtWidgets `
          --hidden-import PyQt6.QtSvg `
          --collect-all PyQt6 `
          main.py
    
    - name: Show output size
      run: |
        Get-ChildItem desktop_app/dist/AgentStudio.exe | Select-Object Name, @{N="Size(MB)";E={[math]::Round($_.Length/1MB,2)}}, LastWriteTime
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AgentStudio-V5
        path: desktop_app/dist/AgentStudio.exe
        retention-days: 30