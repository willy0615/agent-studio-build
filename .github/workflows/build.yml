name: Build AgentStudio.exe

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6 requests pywinauto Pillow
    
    - name: Install VC++ Redistributable (x64)
      run: |
        Write-Host "Downloading VC++ Redistributable..."
        Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile 'vc_redist.x64.exe'
        Write-Host "Installing VC++ Redistributable..."
        Start-Process -FilePath 'vc_redist.x64.exe' -Args '/quiet /norestart' -Wait
        Write-Host "VC++ Redistributable installed"
        Remove-Item 'vc_redist.x64.exe' -Force -ErrorAction SilentlyContinue
    
    - name: Build with PyInstaller (simplified)
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      run: |
        cd desktop_app
        # Build with minimal collect options
        pyinstaller --onedir --windowed --name AgentStudio `
          --hidden-import PyQt6.QtCore `
          --hidden-import PyQt6.QtGui `
          --hidden-import PyQt6.QtWidgets `
          --hidden-import PyQt6.QtSvgWidgets `
          --collect-submodules PyQt6.QtCore `
          --collect-submodules PyQt6.QtGui `
          --collect-submodules PyQt6.QtWidgets `
          --collect-submodules PyQt6.QtSvgWidgets `
          main.py
        
        # Manually copy Qt platform plugins
        $sitePackages = python -c "import site; print(site.getsitepackages()[0])"
        $qtPlugins = Join-Path $sitePackages "PyQt6\Qt6\plugins"
        $destPlugins = "dist\AgentStudio\PyQt6\Qt6\plugins"
        
        if (Test-Path $qtPlugins) {
          Write-Host "Copying Qt plugins from: $qtPlugins"
          New-Item -ItemType Directory -Path $destPlugins -Force | Out-Null
          Copy-Item -Path "$qtPlugins\*" -Destination $destPlugins -Recurse -Force
          Write-Host "Qt plugins copied successfully"
        } else {
          Write-Host "WARNING: Qt plugins directory not found at: $qtPlugins"
        }
    
    - name: Verify build output
      run: |
        Write-Host "Build output contents:"
        Get-ChildItem desktop_app/dist/AgentStudio -Recurse -File | Where-Object { $_.Name -like "*.exe" -or $_.Name -like "*.dll" } | Select-Object FullName, Length | Sort-Object Length -Descending | Select-Object -First 30
        
        Write-Host "`nQt platform plugins:"
        Get-ChildItem "desktop_app/dist/AgentStudio/PyQt6/Qt6/plugins/platforms" -ErrorAction SilentlyContinue | Select-Object Name, Length
    
    - name: Upload artifact (folder)
      uses: actions/upload-artifact@v4
      with:
        name: AgentStudio-V5
        path: desktop_app/dist/AgentStudio
        retention-days: 30
